<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chemistry Formula Practice</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 980px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 40px;
    }
    h1 {
      color: #11998e;
      text-align: center;
      margin-bottom: 10px;
      font-size: 2.5em;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
      font-size: 1.1em;
    }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: #f0fff4;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .stat-item { text-align: center; }
    .stat-label { font-size: 0.9em; color: #666; margin-bottom: 5px; }
    .stat-value { font-size: 1.5em; color: #11998e; font-weight: 700; }
    .timer { color: #38ef7d; }

    .mode-buttons, .practice-buttons {
      text-align: center;
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .controls-row {
      display: flex;
      gap: 20px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 220px;
    }
    .control-group label {
      font-size: 0.95em;
      color: #333;
      font-weight: 600;
    }
    select {
      padding: 10px 15px;
      font-size: 1em;
      border: 2px solid #11998e;
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }
    select:focus { outline: none; border-color: #38ef7d; }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
    }
    .checkbox-group input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
    .checkbox-group label { font-size: 1em; cursor: pointer; }

    button {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
      border: none;
      padding: 12px 26px;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-weight: 600;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(17,153,142,0.4); }
    button:active { transform: translateY(0); }
    button.secondary { background: #6c757d; }
    button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }
    button.evil {
      background: linear-gradient(135deg, #8B0000 0%, #FF0000 100%);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 10px rgba(139,0,0,0.5); }
      50% { box-shadow: 0 0 20px rgba(255,0,0,0.8); }
    }

    .questions-container { margin-top: 22px; display: none; }
    .question {
      background: #f8f9fa;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 10px;
      border-left: 4px solid #11998e;
      position: relative;
    }
    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
      gap: 10px;
    }
    .question-text { font-size: 1.08em; color: #333; font-weight: 500; flex: 1; }
    .chemical-formula {
      font-family: 'Courier New', monospace;
      font-size: 1.18em;
      background: white;
      padding: 10px;
      border-radius: 6px;
      margin: 10px 0;
      overflow-x: auto;
    }
    .hint-button {
      padding: 6px 12px;
      font-size: 0.85em;
      margin: 0;
      background: #ffc107;
      color: #333;
      white-space: nowrap;
    }
    .hint-box {
      background: #fff3cd;
      border: 1px solid #ffc107;
      padding: 12px;
      border-radius: 6px;
      margin-top: 10px;
      display: none;
    }
    .hint-box.show { display: block; }
    .hint-box strong { color: #856404; }

    .answer-input {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    input[type="number"], input[type="text"] {
      padding: 10px;
      font-size: 1em;
      border: 2px solid #ddd;
      border-radius: 6px;
    }
    input[type="number"] { width: 120px; }
    input[type="text"] { width: 260px; }
    input:focus { outline: none; border-color: #11998e; }

    .coefficient-input { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
    .coefficient-input input[type="number"] { width: 72px; }

    .feedback {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 5px;
      font-weight: 650;
      display: none;
    }
    .feedback.correct {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }
    .feedback.incorrect {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .button-container { text-align: center; margin-top: 22px; }
    .score-container {
      text-align: center;
      margin-top: 18px;
      padding: 20px;
      background: #e7f3ff;
      border-radius: 10px;
      display: none;
    }
    .score-container h2 { color: #11998e; margin-bottom: 10px; }
    .score { font-size: 2em; color: #38ef7d; font-weight: 800; }

    .note {
      text-align:center;
      color:#666;
      font-size:0.92em;
      margin-top:8px;
    }

    @media (max-width: 700px) {
      .container { padding: 20px; }
      h1 { font-size: 2em; }
      .control-group { min-width: 100%; }
      .worksheet-card { padding: 20px; }
      .worksheet-controls .control-group { min-width: 100%; }
    }
    .worksheet-card {
      max-width: 980px;
      margin: 24px auto 0;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 32px 40px;
    }
    .worksheet-card h2 {
      color: #11998e;
      font-size: 1.5em;
      margin-bottom: 6px;
    }
    .worksheet-card p.ws-desc {
      color: #666;
      font-size: 0.95em;
      margin-bottom: 20px;
    }
    .worksheet-controls {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .worksheet-controls .control-group { min-width: 180px; }
    .ws-status {
      margin-top: 14px;
      font-size: 0.95em;
      color: #11998e;
      min-height: 1.4em;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Chemistry Formula Practice</h1>
    <p class="subtitle">Stoichiometry &bull; Balancing Equations</p>

    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-label">Questions Today</div>
        <div class="stat-value" id="questionsToday">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Correct Today</div>
        <div class="stat-value" id="correctToday">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Accuracy</div>
        <div class="stat-value" id="accuracy">0%</div>
      </div>
      <div class="stat-item" id="timerDisplay" style="display:none;">
        <div class="stat-label">Time Elapsed</div>
        <div class="stat-value timer" id="timerValue">0:00</div>
      </div>
    </div>

    <div class="mode-buttons">
      <button id="stoichBtn" onclick="switchQuestionMode('stoichiometry')">Stoichiometry</button>
      <button id="balanceBtn" class="secondary" onclick="switchQuestionMode('balancing')">Balancing Equations</button>
    </div>

    <div class="practice-buttons">
      <button id="practiceModeBtn" onclick="switchPracticeMode('practice')">Practice (5 Questions)</button>
    </div>

    <div class="controls-row">
      <div class="control-group">
        <label for="difficulty">Difficulty Level:</label>
        <select id="difficulty">
          <option value="easy" selected>Easy</option>
          <option value="hard">Hard</option>
          <option value="evil">😈 EVIL MODE 😈</option>
        </select>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="timerToggle">
        <label for="timerToggle">Enable Timer (Practice only)</label>
      </div>
    </div>

    <div class="button-container">
      <button id="generateBtn" onclick="generateQuestions()">Generate 5 Questions</button>
      <div class="note" id="difficultyNote"></div>
    </div>

    <div class="questions-container" id="questionsContainer"></div>

    <div class="button-container" id="checkBtnContainer" style="display:none;">
      <button id="checkBtn" onclick="checkAnswers()">Check Answers</button>
      <button onclick="generateQuestions()">Try New Questions</button>
      <button class="secondary" onclick="resetStats()">Reset Stats</button>
    </div>

    <div class="score-container" id="scoreContainer">
      <h2>Your Score</h2>
      <div class="score" id="score"></div>
    </div>
  </div>

<script>
let currentQuestions = [];
let questionMode = 'stoichiometry';
let practiceMode = 'practice';
let timerInterval = null;
let timerSeconds = 0;
let stats = { questionsToday: 0, correctToday: 0 };

function getDifficultyProfile() {
  const d = document.getElementById('difficulty').value;

  if (d === 'easy') {
    return { key:'easy', molesMax: 6, molesDecimals: 0, reactionPools: ['easy'] };
  }
  if (d === 'hard') {
    return { key:'hard', molesMax: 28, molesDecimals: 2, reactionPools: ['medium','hard'] };
  }
  return { key:'evil', molesMax: 60, molesDecimals: 3, reactionPools: ['hard','evil'] };
}

function updateDifficultyNote() {
  const msgByMode = {
    stoichiometry: 'Difficulty scales: larger numbers + more decimal precision.',
    balancing: 'Difficulty scales: more complex equations + larger coefficients.'
  };
  document.getElementById('difficultyNote').textContent = msgByMode[questionMode] || '';
}

document.getElementById('difficulty').addEventListener('change', () => {
  updateDifficultyNote();
  clearQuestions();
});

const reactionPools = {
  easy: [
    { reactants: ['2H2','O2'], products: ['2H2O'], type: 'synthesis' },
    { reactants: ['CH4','2O2'], products: ['CO2','2H2O'], type: 'combustion' },
    { reactants: ['2Na','Cl2'], products: ['2NaCl'], type: 'synthesis' },
    { reactants: ['Zn','2HCl'], products: ['ZnCl2','H2'], type: 'single replacement' },
    { reactants: ['HCl','NaOH'], products: ['NaCl','H2O'], type: 'double replacement' }
  ],
  medium: [
    { reactants: ['2KClO3'], products: ['2KCl','3O2'], type: 'decomposition' },
    { reactants: ['2Al','3Cl2'], products: ['2AlCl3'], type: 'synthesis' },
    { reactants: ['BaCl2','Na2SO4'], products: ['2NaCl','BaSO4'], type: 'double replacement' },
    { reactants: ['C3H8','5O2'], products: ['3CO2','4H2O'], type: 'combustion' },
    { reactants: ['Cu','2AgNO3'], products: ['Cu(NO3)2','2Ag'], type: 'single replacement' }
  ],
  hard: [
    { reactants: ['Fe2O3','3CO'], products: ['2Fe','3CO2'], type: 'single replacement' },
    { reactants: ['2Na3PO4','3CaCl2'], products: ['Ca3(PO4)2','6NaCl'], type: 'double replacement' },
    { reactants: ['2Al(OH)3'], products: ['Al2O3','3H2O'], type: 'decomposition' },
    { reactants: ['2C2H6','7O2'], products: ['4CO2','6H2O'], type: 'combustion' },
    { reactants: ['FeCl3','3NaOH'], products: ['Fe(OH)3','3NaCl'], type: 'double replacement' }
  ],
  evil: [
    { reactants: ['2Fe2(SO4)3','6H2O'], products: ['4Fe(OH)3','6H2SO4'], type: 'double replacement' },
    { reactants: ['(NH4)2Cr2O7'], products: ['Cr2O3','N2','4H2O'], type: 'decomposition' },
    { reactants: ['2Al','3CuSO4'], products: ['Al2(SO4)3','3Cu'], type: 'single replacement' },
    { reactants: ['CaCO3','2HCl'], products: ['CaCl2','H2O','CO2'], type: 'double replacement' },
    { reactants: ['4NH3','5O2'], products: ['4NO','6H2O'], type: 'combustion' }
  ]
};

function setActiveButton(activeId, allIds) {
  allIds.forEach(id => {
    const b = document.getElementById(id);
    if (!b) return;
    b.classList.remove('secondary','evil');
    if (id !== activeId) b.classList.add('secondary');
  });
  const active = document.getElementById(activeId);
  if (active) active.classList.remove('secondary');
}

function formatFormulaHTML(s) {
  return String(s).replace(/([A-Za-z\)])(\d+)/g, '$1<sub>$2</sub>');
}
function formatEquationHTML(eq) { return formatFormulaHTML(eq); }
function escapeHtml(str) {
  return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'","&#39;");
}

function switchQuestionMode(mode) {
  questionMode = mode;
  const id = mode === 'stoichiometry' ? 'stoichBtn' : 'balanceBtn';
  setActiveButton(id, ['stoichBtn','balanceBtn']);
  updateDifficultyNote();
  clearQuestions();
}

function switchPracticeMode(mode) {
  practiceMode = mode;
  setActiveButton('practiceModeBtn', ['practiceModeBtn']);
  clearQuestions();
}

function clearQuestions() {
  document.getElementById('questionsContainer').innerHTML = '';
  document.getElementById('questionsContainer').style.display = 'none';
  document.getElementById('checkBtnContainer').style.display = 'none';
  document.getElementById('scoreContainer').style.display = 'none';
  stopTimer();
}

function loadStats() {
  const today = new Date().toDateString();
  const savedStats = localStorage.getItem('chem-stats');
  const savedDate = localStorage.getItem('chem-stats-date');
  if (savedDate === today && savedStats) stats = JSON.parse(savedStats);
  else {
    stats = { questionsToday: 0, correctToday: 0 };
    localStorage.setItem('chem-stats-date', today);
  }
  updateStatsDisplay();
}
function saveStats() { localStorage.setItem('chem-stats', JSON.stringify(stats)); }
function updateStatsDisplay() {
  document.getElementById('questionsToday').textContent = stats.questionsToday;
  document.getElementById('correctToday').textContent = stats.correctToday;
  const accuracy = stats.questionsToday > 0 ? Math.round((stats.correctToday / stats.questionsToday) * 100) : 0;
  document.getElementById('accuracy').textContent = accuracy + '%';
}
function resetStats() {
  if (confirm('Reset progress stats for today?')) {
    stats = { questionsToday: 0, correctToday: 0 };
    saveStats();
    updateStatsDisplay();
  }
}

function startTimer() {
  if (!document.getElementById('timerToggle').checked) return;
  timerSeconds = 0;
  document.getElementById('timerDisplay').style.display = 'block';
  updateTimerDisplay();
  timerInterval = setInterval(() => { timerSeconds++; updateTimerDisplay(); }, 1000);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
function updateTimerDisplay() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  document.getElementById('timerValue').textContent = `${minutes}:${String(seconds).padStart(2,'0')}`;
}

function pickOne(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function getReactionByDifficulty() {
  const p = getDifficultyProfile();
  const bag = [];
  p.reactionPools.forEach(k => bag.push(...reactionPools[k]));
  return pickOne(bag);
}

function generateQuestions() {
  currentQuestions = [];
  answersChecked = false;
  const qc = document.getElementById('questionsContainer');
  const cb = document.getElementById('checkBtnContainer');
  const sc = document.getElementById('scoreContainer');
  qc.innerHTML = '';
  sc.style.display = 'none';

  const num = (practiceMode === 'practice') ? 5 : 10;
  for (let i = 0; i < num; i++) {
    let q;
    if (questionMode === 'stoichiometry') q = generateStoichiometryQuestion();
    else q = generateBalancingQuestion();

    currentQuestions.push(q);

    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = q.html;
    qc.appendChild(div);
  }
  qc.style.display = 'block';
  cb.style.display = 'block';
  if (practiceMode === 'practice') startTimer(); else stopTimer();
}

function generateStoichiometryQuestion() {
  const p = getDifficultyProfile();
  const reaction = getReactionByDifficulty();

  // Pick given from reactants, find from products — ensure formulas differ
  const givenCompound = pickOne(reaction.reactants);
  const givenFormula = givenCompound.replace(/^(\d+)/,'');
  const distinctProducts = reaction.products.filter(c => c.replace(/^(\d+)/,'') !== givenFormula);
  const productPool = distinctProducts.length > 0 ? distinctProducts : reaction.products;
  const findCompound = pickOne(productPool);

  const givenCoeff = parseFloat((givenCompound.match(/^(\d+)/) || [])[1] || 1);
  const findCoeff  = parseFloat((findCompound.match(/^(\d+)/) || [])[1] || 1);
  const findFormula  = findCompound.replace(/^(\d+)/,'');

  let givenMoles;
  if (p.molesDecimals === 0) givenMoles = randomInt(1, p.molesMax);
  else givenMoles = Number(((Math.random() * (p.molesMax - 0.2)) + 0.2).toFixed(p.molesDecimals));

  // Round answer to match difficulty precision, tolerance is half a unit at that precision
  const decimals = p.molesDecimals === 0 ? 2 : p.molesDecimals + 1;
  const answer = Number((givenMoles * findCoeff / givenCoeff).toFixed(decimals));
  const tolerance = 0.5;

  const idx = currentQuestions.length;
  const eqPlain = reaction.reactants.join(' + ') + ' \u2192 ' + reaction.products.join(' + ');
  const eqHTML = formatEquationHTML(eqPlain);

  const stepStr = `${givenMoles} mol ${givenFormula} x (${findCoeff} mol ${findFormula} / ${givenCoeff} mol ${givenFormula}) = ${answer} mol`;

  const html = `
    <div class="question-header">
      <div class="question-text">${idx + 1}. If you have ${givenMoles} moles of ${formatEquationHTML(givenFormula)}, how many moles of ${formatEquationHTML(findFormula)} can you make?</div>
      ${practiceMode === 'practice' ? `<button class="hint-button" onclick="toggleHint(${idx})">&#128161; Hint</button>` : ''}
    </div>
    ${practiceMode === 'practice' ? `
      <div class="hint-box" id="hint${idx}">
        <strong>Balanced Equation:</strong> ${eqHTML}<br>
        <strong>Given:</strong> ${givenMoles} mol ${formatEquationHTML(givenFormula)}<br>
        <strong>Find:</strong> mol ${formatEquationHTML(findFormula)}<br>
        <strong>Mole ratio:</strong> ${findCoeff} mol ${formatEquationHTML(findFormula)} per ${givenCoeff} mol ${formatEquationHTML(givenFormula)}
      </div>` : ''}
    <div class="chemical-formula">${eqHTML}</div>
    <div class="answer-input">
      <input type="number" step="${Math.pow(10, -decimals)}" id="answer${idx}" placeholder="Answer">
      <span>moles of ${formatEquationHTML(findFormula)}</span>
    </div>
    <div class="feedback" id="feedback${idx}"></div>
  `;

  return { type:'stoichiometry', answer, tolerance, steps: stepStr, html };
}

function generateBalancingQuestion() {
  const reaction = getReactionByDifficulty();
  const idx = currentQuestions.length;

  const reactants = reaction.reactants.map(r => r.replace(/^(\d+)/,''));
  const products  = reaction.products.map(p => p.replace(/^(\d+)/,''));
  const correctCoeffs = reaction.reactants.concat(reaction.products).map(c => parseFloat((c.match(/^(\d+)/) || [])[1] || 1));
  const allCompounds = reactants.concat(products);

  const eqPlain = reactants.join(' + ') + ' → ' + products.join(' + ');
  const eqHTML = formatEquationHTML(eqPlain);

  const html = `
    <div class="question-header">
      <div class="question-text">${idx + 1}. Balance this equation:</div>
      ${practiceMode === 'practice' ? `<button class="hint-button" onclick="toggleHint(${idx})">💡 Hint</button>` : ''}
    </div>
    ${practiceMode === 'practice' ? `
      <div class="hint-box" id="hint${idx}">
        <strong>Tip:</strong> Count atoms on each side.<br>
        <strong>Strategy:</strong> Start with the most complex compound.
      </div>` : ''}
    <div class="chemical-formula">${eqHTML}</div>
    <div class="answer-input">
      ${allCompounds.map((c, i) => `
        <div class="coefficient-input">
          <input type="number" min="1" step="1" id="coeff${idx}_${i}" placeholder="?" />
          <span>${formatEquationHTML(c)}</span>
          ${i === reactants.length - 1 ? '<span style="margin:0 10px;">→</span>' : (i < allCompounds.length - 1 ? '<span style="margin:0 5px;">+</span>' : '')}
        </div>
      `).join('')}
    </div>
    <div class="feedback" id="feedback${idx}"></div>
  `;

  return { type:'balancing', answer: correctCoeffs, numCompounds: allCompounds.length,
           steps: `Correct coefficients: ${reaction.reactants.join(' + ')} → ${reaction.products.join(' + ')}`, html };
}


function toggleHint(index) {
  const box = document.getElementById('hint' + index);
  if (box) box.classList.toggle('show');
}

function markCorrect(el) {
  el.className = 'feedback correct';
  el.textContent = '✓ Correct!';
}
function markIncorrect(el, details) {
  el.className = 'feedback incorrect';
  el.innerHTML = `&#x2717; Incorrect.<br>${formatEquationHTML(escapeHtml(details))}`;
}

let answersChecked = false;

function checkAnswers() {
  let correct = 0;
  stopTimer();

  currentQuestions.forEach((q, i) => {
    const feedback = document.getElementById('feedback' + i);
    if (!answersChecked) stats.questionsToday++;

    if (q.type === 'stoichiometry') {
      const userAnswer = parseFloat(document.getElementById('answer' + i).value);
      const tol = q.tolerance ?? 0.5;
      if (!isNaN(userAnswer) && Math.abs(userAnswer - q.answer) <= tol) {
        if (!answersChecked) { correct++; stats.correctToday++; }
        markCorrect(feedback);
      } else {
        markIncorrect(feedback, q.steps);
      }
    }
    else if (q.type === 'balancing') {
      const userCoeffs = [];
      let valid = true;
      for (let j = 0; j < q.numCompounds; j++) {
        const val = parseInt(document.getElementById(`coeff${i}_${j}`).value, 10);
        if (isNaN(val) || val < 1) { valid = false; break; }
        userCoeffs.push(val);
      }
      const coeffsCorrect = JSON.stringify(userCoeffs) === JSON.stringify(q.answer);
      if (valid && coeffsCorrect) {
        if (!answersChecked) { correct++; stats.correctToday++; }
        markCorrect(feedback);
      } else {
        markIncorrect(feedback, q.steps);
      }
    }
  });

  if (!answersChecked) {
    saveStats();
    updateStatsDisplay();
  }
  answersChecked = true;

  const total = (practiceMode === 'practice') ? 5 : 10;
  document.getElementById('score').textContent = `${correct} / ${total}`;
  document.getElementById('scoreContainer').style.display = 'block';
}

(function init() {
  setActiveButton('stoichBtn', ['stoichBtn','balanceBtn']);
  setActiveButton('practiceModeBtn', ['practiceModeBtn']);
  updateDifficultyNote();
  loadStats();
})();
</script>

<!-- ═══════════════════════════════════════════════════════════
     WORKSHEET GENERATOR CARD
════════════════════════════════════════════════════════════ -->
  <div class="worksheet-card">
    <h2>&#x1F4C4; Worksheet Generator</h2>
    <p class="ws-desc">Generate a printable 2-page PDF — 10 questions on page&nbsp;1, full answer key on page&nbsp;2.</p>
    <div class="worksheet-controls">
      <div class="control-group">
        <label for="wsType">Question Type:</label>
        <select id="wsType">
          <option value="stoichiometry">Stoichiometry</option>
          <option value="balancing">Balancing Equations</option>
        </select>
      </div>
      <div class="control-group">
        <label for="wsDifficulty">Difficulty:</label>
        <select id="wsDifficulty">
          <option value="easy">Easy</option>
          <option value="hard">Hard</option>
          <option value="evil">&#x1F608; Evil Mode</option>
        </select>
      </div>
      <div style="padding-bottom:2px;">
        <button onclick="generateWorksheetPDF()">Generate &amp; Download PDF</button>
      </div>
    </div>
    <div class="ws-status" id="wsStatus"></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// ── Worksheet PDF generator (client-side via jsPDF) ──────────────────────────

const WS_REACTION_POOLS = {
  easy:   reactionPools.easy,
  medium: reactionPools.medium,
  hard:   reactionPools.hard,
  evil:   reactionPools.evil
};

const WS_PROFILES = {
  easy: { molesMax: 6,  molesDecimals: 0, pools: ['easy'] },
  hard: { molesMax: 28, molesDecimals: 2, pools: ['medium','hard'] },
  evil: { molesMax: 60, molesDecimals: 3, pools: ['hard','evil'] },
};

function wsPickOne(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function wsRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function wsGetReaction(profile) {
  const bag = [];
  profile.pools.forEach(k => bag.push(...WS_REACTION_POOLS[k]));
  return wsPickOne(bag);
}

function wsStripCoeff(s)  { return s.replace(/^\d+/,''); }
function wsGetCoeff(s)    { const m = s.match(/^(\d+)/); return m ? parseInt(m[1]) : 1; }

// Convert "H2O", "Cu(NO3)2" etc. into an array of {text, sub} segments for drawing
function parseChemSegments(str) {
  const segs = [];
  let i = 0;
  while (i < str.length) {
    // collect non-digit chars
    let word = '';
    while (i < str.length && !/\d/.test(str[i])) { word += str[i]; i++; }
    if (word) segs.push({ text: word, sub: false });
    // collect digit chars
    let num = '';
    while (i < str.length && /\d/.test(str[i])) { num += str[i]; i++; }
    if (num) segs.push({ text: num, sub: true });
  }
  return segs;
}

// Draw chemical formula with subscripts at (x,y). Returns width used.
function drawChem(doc, str, x, y, mainSize, subSize) {
  const segs = parseChemSegments(str);
  let cx = x;
  segs.forEach(seg => {
    if (seg.sub) {
      doc.setFontSize(subSize);
      doc.text(seg.text, cx, y + 1.5);
    } else {
      doc.setFontSize(mainSize);
      doc.text(seg.text, cx, y);
    }
    cx += doc.getStringUnitWidth(seg.text) * (seg.sub ? subSize : mainSize) / doc.internal.scaleFactor;
  });
  return cx - x;
}

// Measure width of a chemical string without drawing
function measureChem(doc, str, mainSize, subSize) {
  const segs = parseChemSegments(str);
  let w = 0;
  segs.forEach(seg => {
    const sz = seg.sub ? subSize : mainSize;
    w += doc.getStringUnitWidth(seg.text) * sz / doc.internal.scaleFactor;
  });
  return w;
}

// Draw a full equation: reactants → products. Returns final x.
function drawEquation(doc, reactants, products, x, y, mainSize, subSize) {
  const spaceW = doc.getStringUnitWidth(' ') * mainSize / doc.internal.scaleFactor;
  const plusW  = doc.getStringUnitWidth(' + ') * mainSize / doc.internal.scaleFactor;
  const arrowW = doc.getStringUnitWidth(' \u2192 ') * mainSize / doc.internal.scaleFactor;
  let cx = x;

  reactants.forEach((r, i) => {
    cx += drawChem(doc, r, cx, y, mainSize, subSize);
    if (i < reactants.length - 1) {
      doc.setFontSize(mainSize);
      doc.text(' + ', cx, y);
      cx += plusW;
    }
  });
  doc.setFontSize(mainSize);
  doc.text(' \u2192 ', cx, y);
  cx += arrowW;
  products.forEach((p, i) => {
    cx += drawChem(doc, p, cx, y, mainSize, subSize);
    if (i < products.length - 1) {
      doc.setFontSize(mainSize);
      doc.text(' + ', cx, y);
      cx += plusW;
    }
  });
  return cx;
}

// Measure total equation width
function measureEquation(doc, reactants, products, mainSize, subSize) {
  const plusW  = doc.getStringUnitWidth(' + ') * mainSize / doc.internal.scaleFactor;
  const arrowW = doc.getStringUnitWidth(' \u2192 ') * mainSize / doc.internal.scaleFactor;
  let w = 0;
  reactants.forEach((r,i) => {
    w += measureChem(doc, r, mainSize, subSize);
    if (i < reactants.length-1) w += plusW;
  });
  w += arrowW;
  products.forEach((p,i) => {
    w += measureChem(doc, p, mainSize, subSize);
    if (i < products.length-1) w += plusW;
  });
  return w;
}

// ── Question generators ───────────────────────────────────────────────────────

function wsMakeStoich(profile) {
  const reaction = wsGetReaction(profile);
  const givenCpd = wsPickOne(reaction.reactants);
  const givenFormula = wsStripCoeff(givenCpd);
  const givenCoeff   = wsGetCoeff(givenCpd);

  const distinct = reaction.products.filter(p => wsStripCoeff(p) !== givenFormula);
  const pool = distinct.length > 0 ? distinct : reaction.products;
  const findCpd    = wsPickOne(pool);
  const findFormula = wsStripCoeff(findCpd);
  const findCoeff   = wsGetCoeff(findCpd);

  const dec = profile.molesDecimals;
  let givenMoles;
  if (dec === 0) givenMoles = wsRandomInt(1, profile.molesMax);
  else givenMoles = Number((Math.random() * (profile.molesMax - 0.2) + 0.2).toFixed(dec));

  const decimals = dec === 0 ? 2 : dec + 1;
  const answer = Number((givenMoles * findCoeff / givenCoeff).toFixed(decimals));

  return {
    type: 'stoichiometry',
    reaction,
    givenFormula, givenCoeff, givenMoles,
    findFormula,  findCoeff,
    answer,
  };
}

function wsMakeBalancing(profile) {
  const reaction = wsGetReaction(profile);
  const bareReactants = reaction.reactants.map(wsStripCoeff);
  const bareProducts  = reaction.products.map(wsStripCoeff);
  const coeffs = reaction.reactants.concat(reaction.products).map(wsGetCoeff);
  return { type: 'balancing', reaction, bareReactants, bareProducts, coeffs };
}

// ── PDF rendering ─────────────────────────────────────────────────────────────

function generateWorksheetPDF() {
  const { jsPDF } = window.jspdf;
  const qtype      = document.getElementById('wsType').value;
  const difficulty = document.getElementById('wsDifficulty').value;
  const status     = document.getElementById('wsStatus');

  status.textContent = 'Generating PDF…';

  setTimeout(() => {
    try {
      const profile  = WS_PROFILES[difficulty];
      const isStoich = qtype === 'stoichiometry';
      const doc      = new jsPDF({ unit: 'pt', format: 'letter' });

      const PW = 612, PH = 792;
      const ML = 54, MR = 54, MT = 54;
      const contentW = PW - ML - MR;

      const MAIN = 11, SUB = 8;
      const GREEN = [17, 153, 142];

      // ── helper: draw page header ──────────────────────────────────────────
      function drawHeader(pageLabel) {
        doc.setFont('helvetica','bold');
        doc.setFontSize(18);
        doc.setTextColor(17,153,142);
        doc.text('Chemistry Worksheet', PW/2, MT + 14, { align:'center' });

        const typeLabel = isStoich ? 'Stoichiometry' : 'Balancing Equations';
        const diffLabel = difficulty.charAt(0).toUpperCase() + difficulty.slice(1);
        doc.setFont('helvetica','normal');
        doc.setFontSize(11);
        doc.setTextColor(100,100,100);
        doc.text(`${typeLabel}  |  ${diffLabel}  |  ${pageLabel}`, PW/2, MT + 30, { align:'center' });

        doc.setDrawColor(...GREEN);
        doc.setLineWidth(1);
        doc.line(ML, MT + 38, PW - MR, MT + 38);

        doc.setTextColor(0,0,0);
        return MT + 54; // return y after header
      }

      // ── Generate 10 questions ─────────────────────────────────────────────
      const questions = [];
      for (let i = 0; i < 10; i++) {
        questions.push(isStoich ? wsMakeStoich(profile) : wsMakeBalancing(profile));
      }

      // ══════════════════════════════════════════════
      // PAGE 1: Questions
      // ══════════════════════════════════════════════
      let y = drawHeader('Questions');

      // Name / Date / Score line
      doc.setFont('helvetica','normal');
      doc.setFontSize(11);
      doc.setTextColor(0,0,0);
      doc.text('Name: _________________________    Date: ______________    Score: ______ / 10', ML, y);
      y += 22;

      doc.setDrawColor(200,200,200);
      doc.setLineWidth(0.5);
      doc.line(ML, y, PW-MR, y);
      y += 14;

      questions.forEach((q, idx) => {
        const num = idx + 1;
        doc.setFont('helvetica','bold');
        doc.setFontSize(MAIN);
        doc.setTextColor(0,0,0);

        if (q.type === 'stoichiometry') {
          // Line 1: question number + "Given the reaction:"
          doc.text(`${num}.`, ML, y);
          doc.setFont('helvetica','normal');
          doc.text(' Given the reaction:', ML + 18, y);
          // Line 2: equation (indented)
          y += 15;
          doc.setFont('helvetica','normal');
          doc.setTextColor(0,0,100);
          drawEquation(doc, q.reaction.reactants, q.reaction.products, ML + 18, y, MAIN, SUB);
          doc.setTextColor(0,0,0);
          // Line 3: "If you have X mol [formula], how many mol [formula] can be produced?"
          y += 16;
          let cx = ML + 18;
          doc.setFont('helvetica','normal');
          doc.setFontSize(MAIN);
          doc.text('If you have ', cx, y);
          cx += doc.getStringUnitWidth('If you have ') * MAIN / doc.internal.scaleFactor;
          doc.setFont('helvetica','bold');
          doc.text(`${q.givenMoles} mol`, cx, y);
          cx += doc.getStringUnitWidth(`${q.givenMoles} mol`) * MAIN / doc.internal.scaleFactor;
          doc.setFont('helvetica','normal');
          doc.text(' of ', cx, y);
          cx += doc.getStringUnitWidth(' of ') * MAIN / doc.internal.scaleFactor;
          cx += drawChem(doc, q.givenFormula, cx, y, MAIN, SUB);
          doc.setFontSize(MAIN);
          doc.text(', how many moles of ', cx, y);
          cx += doc.getStringUnitWidth(', how many moles of ') * MAIN / doc.internal.scaleFactor;
          cx += drawChem(doc, q.findFormula, cx, y, MAIN, SUB);
          doc.setFontSize(MAIN);
          doc.text(' can be produced?', cx, y);
          // Answer blank
          y += 16;
          doc.text('Answer: ______________ mol', ML + 18, y);

        } else {
          // Balancing
          doc.text(`${num}.`, ML, y);
          doc.setFont('helvetica','normal');
          doc.text(' Balance the following equation:', ML + 18, y);
          y += 16;

          // Draw blanks + bare formulas
          const spaceW = doc.getStringUnitWidth('   ') * MAIN / doc.internal.scaleFactor;
          const plusW  = doc.getStringUnitWidth(' + ') * MAIN / doc.internal.scaleFactor;
          const arrowW = doc.getStringUnitWidth(' \u2192 ') * MAIN / doc.internal.scaleFactor;
          const underW = 22;
          let cx = ML + 18;

          const allBare = q.bareReactants.concat(q.bareProducts);
          allBare.forEach((formula, i) => {
            // draw blank underline
            doc.setDrawColor(0,0,0);
            doc.setLineWidth(0.7);
            doc.line(cx, y+1, cx + underW, y+1);
            cx += underW + 3;
            cx += drawChem(doc, formula, cx, y, MAIN, SUB);
            doc.setFontSize(MAIN);
            if (i === q.bareReactants.length - 1) {
              doc.text(' \u2192 ', cx, y);
              cx += arrowW;
            } else if (i < allBare.length - 1) {
              doc.text(' + ', cx, y);
              cx += plusW;
            }
          });
        }

        y += 20;
        // light separator
        doc.setDrawColor(230,230,230);
        doc.setLineWidth(0.3);
        doc.line(ML, y, PW-MR, y);
        y += 10;
      });

      // ══════════════════════════════════════════════
      // PAGE 2: Answer Key
      // ══════════════════════════════════════════════
      doc.addPage();
      y = drawHeader('Answer Key');

      doc.setFont('helvetica','italic');
      doc.setFontSize(10);
      doc.setTextColor(120,120,120);
      doc.text('Do not distribute to students before the worksheet is completed.', PW/2, y, { align:'center' });
      y += 20;

      questions.forEach((q, idx) => {
        const num = idx + 1;
        doc.setFont('helvetica','bold');
        doc.setFontSize(MAIN);
        doc.setTextColor(0,0,0);
        doc.text(`${num}.`, ML, y);

        if (q.type === 'stoichiometry') {
          doc.setFont('helvetica','normal');
          let cx = ML + 18;
          cx += drawChem(doc, q.givenFormula, cx, y, MAIN, SUB);
          doc.setFontSize(MAIN);
          doc.text(`: ${q.givenMoles} mol \u00D7 (${q.findCoeff}/${q.givenCoeff}) = `, cx, y);
          cx += doc.getStringUnitWidth(`: ${q.givenMoles} mol \u00D7 (${q.findCoeff}/${q.givenCoeff}) = `) * MAIN / doc.internal.scaleFactor;
          doc.setFont('helvetica','bold');
          doc.setTextColor(...GREEN);
          doc.text(`${q.answer} mol`, cx, y);
          cx += doc.getStringUnitWidth(`${q.answer} mol`) * MAIN / doc.internal.scaleFactor;
          doc.setTextColor(0,0,0);
          doc.setFont('helvetica','normal');
          doc.text(' of ', cx, y);
          cx += doc.getStringUnitWidth(' of ') * MAIN / doc.internal.scaleFactor;
          drawChem(doc, q.findFormula, cx, y, MAIN, SUB);

        } else {
          // Balancing answer — show full balanced equation
          let cx = ML + 18;
          const allBare = q.bareReactants.concat(q.bareProducts);
          const plusW  = doc.getStringUnitWidth(' + ') * MAIN / doc.internal.scaleFactor;
          const arrowW = doc.getStringUnitWidth(' \u2192 ') * MAIN / doc.internal.scaleFactor;
          allBare.forEach((formula, i) => {
            doc.setFont('helvetica','bold');
            doc.setFontSize(MAIN);
            doc.setTextColor(...GREEN);
            doc.text(`${q.coeffs[i]} `, cx, y);
            cx += doc.getStringUnitWidth(`${q.coeffs[i]} `) * MAIN / doc.internal.scaleFactor;
            doc.setTextColor(0,0,0);
            doc.setFont('helvetica','normal');
            cx += drawChem(doc, formula, cx, y, MAIN, SUB);
            doc.setFontSize(MAIN);
            if (i === q.bareReactants.length - 1) {
              doc.text(' \u2192 ', cx, y);
              cx += arrowW;
            } else if (i < allBare.length - 1) {
              doc.text(' + ', cx, y);
              cx += plusW;
            }
          });
        }

        y += 16;
        doc.setDrawColor(230,230,230);
        doc.setLineWidth(0.3);
        doc.line(ML, y, PW-MR, y);
        y += 10;
      });

      // Save
      const typeLabel = isStoich ? 'stoichiometry' : 'balancing';
      doc.save(`worksheet_${typeLabel}_${difficulty}.pdf`);
      status.textContent = '✓ PDF downloaded!';
      setTimeout(() => { status.textContent = ''; }, 4000);

    } catch(e) {
      console.error(e);
      status.textContent = 'Error generating PDF. See console for details.';
    }
  }, 50);
}
</script>
