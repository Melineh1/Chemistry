<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chemistry Formula Practice</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 980px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 40px;
    }
    h1 {
      color: #11998e;
      text-align: center;
      margin-bottom: 10px;
      font-size: 2.5em;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
      font-size: 1.1em;
    }
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: #f0fff4;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .stat-item { text-align: center; }
    .stat-label { font-size: 0.9em; color: #666; margin-bottom: 5px; }
    .stat-value { font-size: 1.5em; color: #11998e; font-weight: 700; }

    .mode-buttons {
      text-align: center;
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .controls-row {
      display: flex;
      gap: 20px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 220px;
    }
    .control-group label {
      font-size: 0.95em;
      color: #333;
      font-weight: 600;
    }
    select {
      padding: 10px 15px;
      font-size: 1em;
      border: 2px solid #11998e;
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }
    select:focus { outline: none; border-color: #38ef7d; }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
    }
    .checkbox-group input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
    .checkbox-group label { font-size: 1em; cursor: pointer; }

    button {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
      border: none;
      padding: 12px 26px;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-weight: 600;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(17,153,142,0.4); }
    button:active { transform: translateY(0); }
    button.secondary { background: #6c757d; }
    button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }
    button.evil {
      background: linear-gradient(135deg, #8B0000 0%, #FF0000 100%);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 10px rgba(139,0,0,0.5); }
      50% { box-shadow: 0 0 20px rgba(255,0,0,0.8); }
    }

    .questions-container { margin-top: 22px; display: none; }
    .question {
      background: #f8f9fa;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 10px;
      border-left: 4px solid #11998e;
      position: relative;
    }
    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
      gap: 10px;
    }
    .question-text { font-size: 1.08em; color: #333; font-weight: 500; flex: 1; }
    .chemical-formula {
      font-family: 'Courier New', monospace;
      font-size: 1.18em;
      background: white;
      padding: 10px;
      border-radius: 6px;
      margin: 10px 0;
      overflow-x: auto;
    }
    .hint-button {
      padding: 6px 12px;
      font-size: 0.85em;
      margin: 0;
      background: #ffc107;
      color: #333;
      white-space: nowrap;
    }
    .hint-box {
      background: #fff3cd;
      border: 1px solid #ffc107;
      padding: 12px;
      border-radius: 6px;
      margin-top: 10px;
      display: none;
    }
    .hint-box.show { display: block; }
    .hint-box strong { color: #856404; }

    .answer-input {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    input[type="number"], input[type="text"] {
      padding: 10px;
      font-size: 1em;
      border: 2px solid #ddd;
      border-radius: 6px;
    }
    input[type="number"] { width: 120px; }
    input[type="text"] { width: 260px; }
    input:focus { outline: none; border-color: #11998e; }

    .coefficient-input { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
    .coefficient-input input[type="number"] { width: 72px; }

    .feedback {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 5px;
      font-weight: 650;
      display: none;
    }
    .feedback.correct {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }
    .feedback.incorrect {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .button-container { text-align: center; margin-top: 22px; }
    .score-container {
      text-align: center;
      margin-top: 18px;
      padding: 20px;
      background: #e7f3ff;
      border-radius: 10px;
      display: none;
    }
    .score-container h2 { color: #11998e; margin-bottom: 10px; }
    .score { font-size: 2em; color: #38ef7d; font-weight: 800; }

    .note {
      text-align:center;
      color:#666;
      font-size:0.92em;
      margin-top:8px;
    }

    @media (max-width: 700px) {
      .container { padding: 20px; }
      h1 { font-size: 2em; }
      .control-group { min-width: 100%; }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Chemistry Formula Practice</h1>
    <p class="subtitle">Stoichiometry &bull; Balancing Equations</p>

    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-label">Questions Today</div>
        <div class="stat-value" id="questionsToday">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Correct Today</div>
        <div class="stat-value" id="correctToday">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Accuracy</div>
        <div class="stat-value" id="accuracy">0%</div>
      </div>
    </div>

    <div class="mode-buttons">
      <button id="stoichBtn" onclick="switchQuestionMode('stoichiometry')">Stoichiometry</button>
      <button id="balanceBtn" class="secondary" onclick="switchQuestionMode('balancing')">Balancing Equations</button>
    </div>

    <div class="controls-row">
      <div class="control-group" id="stoichTypeControl">
        <label for="difficulty">Stoichiometry Type:</label>
        <select id="difficulty">
          <option value="mole-to-mole" selected>Mole to Mole</option>
          <option value="mole-to-mass">Mole to Mass</option>
          <option value="mass-to-mass">Mass to Mass</option>
        </select>
      </div>
    </div>

    <div class="button-container">
      <button id="generateBtn" onclick="generateQuestions()">Generate 5 Questions</button>
      <div class="note" id="difficultyNote"></div>
    </div>

    <div class="questions-container" id="questionsContainer"></div>

    <div class="button-container" id="checkBtnContainer" style="display:none;">
      <button id="checkBtn" onclick="checkAnswers()">Check Answers</button>
      <button onclick="generateQuestions()">Try New Questions</button>
      <button class="secondary" onclick="resetStats()">Reset Stats</button>
    </div>

    <div class="score-container" id="scoreContainer">
      <h2>Your Score</h2>
      <div class="score" id="score"></div>
    </div>
  </div>

<script>
let currentQuestions = [];
let questionMode = 'stoichiometry';
let stats = { questionsToday: 0, correctToday: 0 };

function getDifficultyProfile() {
  const d = document.getElementById('difficulty').value;
  if (d === 'mole-to-mole') {
    return { key:'mole-to-mole', molesMax: 10, molesDecimals: 1, reactionPools: ['easy','medium'] };
  }
  if (d === 'mole-to-mass') {
    return { key:'mole-to-mass', molesMax: 10, molesDecimals: 1, reactionPools: ['easy','medium','hard'] };
  }
  return { key:'mass-to-mass', gramsMax: 200, reactionPools: ['medium','hard','evil'] };
}

function updateDifficultyNote() {
  const isStoich = questionMode === 'stoichiometry';
  if (!isStoich) {
    document.getElementById('difficultyNote').textContent = 'Difficulty scales: more complex equations + larger coefficients.';
    return;
  }
  const d = document.getElementById('difficulty').value;
  const msgs = {
    'mole-to-mole': 'Use the mole ratio from the balanced equation to convert between moles of reactants and products.',
    'mole-to-mass': 'Convert moles of a reactant to grams of a product using the mole ratio and molar mass.',
    'mass-to-mass': 'Convert grams of a reactant to grams of a product using molar mass and the mole ratio.'
  };
  document.getElementById('difficultyNote').textContent = msgs[d] || '';
}

const atomicMasses = {
  H: 1.008, He: 4.003, C: 12.011, N: 14.007, O: 15.999, F: 19.00, Ne: 20.18,
  Na: 22.990, Mg: 24.305, Al: 26.982, Si: 28.086, P: 30.974, S: 32.06, Cl: 35.453,
  K: 39.098, Ca: 40.078, Fe: 55.845, Cu: 63.546, Zn: 65.38, Ag: 107.868, Ba: 137.327,
  Cr: 51.996, Ag: 107.868, Ba: 137.327
};

function calcMolarMass(formula) {
  let i = 0;
  function parseGroup() {
    const counts = {};
    while (i < formula.length) {
      const ch = formula[i];
      if (ch === '(') {
        i++;
        const inner = parseGroup();
        i++; // skip ')'
        const mult = parseNum() || 1;
        for (const el in inner) counts[el] = (counts[el] || 0) + inner[el] * mult;
        continue;
      }
      if (ch === ')') break;
      const el = parseEl();
      const n = parseNum() || 1;
      counts[el] = (counts[el] || 0) + n;
    }
    return counts;
  }
  function parseEl() {
    let el = formula[i++];
    if (i < formula.length && /[a-z]/.test(formula[i])) el += formula[i++];
    return el;
  }
  function parseNum() {
    let s = i;
    while (i < formula.length && /\d/.test(formula[i])) i++;
    return s === i ? null : parseInt(formula.slice(s, i));
  }
  const counts = parseGroup();
  let mass = 0;
  for (const el in counts) {
    if (!atomicMasses[el]) throw new Error('Unknown element: ' + el);
    mass += atomicMasses[el] * counts[el];
  }
  return mass;
}

document.getElementById('difficulty').addEventListener('change', () => {
  updateDifficultyNote();
  clearQuestions();
});

const reactionPools = {
  easy: [
    { reactants: ['2H2','O2'], products: ['2H2O'], type: 'synthesis' },
    { reactants: ['CH4','2O2'], products: ['CO2','2H2O'], type: 'combustion' },
    { reactants: ['2Na','Cl2'], products: ['2NaCl'], type: 'synthesis' },
    { reactants: ['Zn','2HCl'], products: ['ZnCl2','H2'], type: 'single replacement' },
    { reactants: ['HCl','NaOH'], products: ['NaCl','H2O'], type: 'double replacement' }
  ],
  medium: [
    { reactants: ['2KClO3'], products: ['2KCl','3O2'], type: 'decomposition' },
    { reactants: ['2Al','3Cl2'], products: ['2AlCl3'], type: 'synthesis' },
    { reactants: ['BaCl2','Na2SO4'], products: ['2NaCl','BaSO4'], type: 'double replacement' },
    { reactants: ['C3H8','5O2'], products: ['3CO2','4H2O'], type: 'combustion' },
    { reactants: ['Cu','2AgNO3'], products: ['Cu(NO3)2','2Ag'], type: 'single replacement' }
  ],
  hard: [
    { reactants: ['Fe2O3','3CO'], products: ['2Fe','3CO2'], type: 'single replacement' },
    { reactants: ['2Na3PO4','3CaCl2'], products: ['Ca3(PO4)2','6NaCl'], type: 'double replacement' },
    { reactants: ['2Al(OH)3'], products: ['Al2O3','3H2O'], type: 'decomposition' },
    { reactants: ['2C2H6','7O2'], products: ['4CO2','6H2O'], type: 'combustion' },
    { reactants: ['FeCl3','3NaOH'], products: ['Fe(OH)3','3NaCl'], type: 'double replacement' }
  ],
  evil: [
    { reactants: ['2Fe2(SO4)3','6H2O'], products: ['4Fe(OH)3','6H2SO4'], type: 'double replacement' },
    { reactants: ['(NH4)2Cr2O7'], products: ['Cr2O3','N2','4H2O'], type: 'decomposition' },
    { reactants: ['2Al','3CuSO4'], products: ['Al2(SO4)3','3Cu'], type: 'single replacement' },
    { reactants: ['CaCO3','2HCl'], products: ['CaCl2','H2O','CO2'], type: 'double replacement' },
    { reactants: ['4NH3','5O2'], products: ['4NO','6H2O'], type: 'combustion' }
  ]
};

function setActiveButton(activeId, allIds) {
  allIds.forEach(id => {
    const b = document.getElementById(id);
    if (!b) return;
    b.classList.remove('secondary','evil');
    if (id !== activeId) b.classList.add('secondary');
  });
  const active = document.getElementById(activeId);
  if (active) active.classList.remove('secondary');
}

function formatFormulaHTML(s) {
  return String(s).replace(/([A-Za-z\)])(\d+)/g, '$1<sub>$2</sub>');
}
function formatEquationHTML(eq) { return formatFormulaHTML(eq); }
function escapeHtml(str) {
  return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'","&#39;");
}

function switchQuestionMode(mode) {
  questionMode = mode;
  const id = mode === 'stoichiometry' ? 'stoichBtn' : 'balanceBtn';
  setActiveButton(id, ['stoichBtn','balanceBtn']);
  document.getElementById('stoichTypeControl').style.display = mode === 'stoichiometry' ? 'flex' : 'none';
  updateDifficultyNote();
  clearQuestions();
}


(function init() {
  setActiveButton('stoichBtn', ['stoichBtn','balanceBtn']);
  document.getElementById('stoichTypeControl').style.display = 'flex';
  updateDifficultyNote();
  loadStats();
})();function clearQuestions() {
  document.getElementById('questionsContainer').innerHTML = '';
  document.getElementById('questionsContainer').style.display = 'none';
  document.getElementById('checkBtnContainer').style.display = 'none';
  document.getElementById('scoreContainer').style.display = 'none';
}

function loadStats() {
  const saved = sessionStorage.getItem('chem-stats');
  if (saved) stats = JSON.parse(saved);
  updateStatsDisplay();
}
function saveStats() { sessionStorage.setItem('chem-stats', JSON.stringify(stats)); }
function updateStatsDisplay() {
  document.getElementById('questionsToday').textContent = stats.questionsToday;
  document.getElementById('correctToday').textContent = stats.correctToday;
  const accuracy = stats.questionsToday > 0 ? Math.round((stats.correctToday / stats.questionsToday) * 100) : 0;
  document.getElementById('accuracy').textContent = accuracy + '%';
}
function resetStats() {
  if (confirm('Reset stats?')) {
    stats = { questionsToday: 0, correctToday: 0 };
    saveStats();
    updateStatsDisplay();
  }
}

function pickOne(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function getReactionByDifficulty() {
  const p = getDifficultyProfile();
  const bag = [];
  p.reactionPools.forEach(k => bag.push(...reactionPools[k]));
  return pickOne(bag);
}

function generateQuestions() {
  currentQuestions = [];
  answersChecked = false;
  const qc = document.getElementById('questionsContainer');
  const cb = document.getElementById('checkBtnContainer');
  const sc = document.getElementById('scoreContainer');
  qc.innerHTML = '';
  sc.style.display = 'none';

  for (let i = 0; i < 5; i++) {
    let q;
    if (questionMode === 'stoichiometry') q = generateStoichiometryQuestion();
    else q = generateBalancingQuestion();

    currentQuestions.push(q);

    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = q.html;
    qc.appendChild(div);
  }
  qc.style.display = 'block';
  cb.style.display = 'block';
}

function generateStoichiometryQuestion() {
  const p = getDifficultyProfile();
  const reaction = getReactionByDifficulty();
  const key = p.key;

  // Pick given (reactant) and find (product)
  const givenCompound = pickOne(reaction.reactants);
  const givenFormula  = givenCompound.replace(/^(\d+)/,'');
  const givenCoeff    = parseFloat((givenCompound.match(/^(\d+)/) || [])[1] || 1);

  const distinctProducts = reaction.products.filter(c => c.replace(/^(\d+)/,'') !== givenFormula);
  const productPool  = distinctProducts.length > 0 ? distinctProducts : reaction.products;
  const findCompound = pickOne(productPool);
  const findFormula  = findCompound.replace(/^(\d+)/,'');
  const findCoeff    = parseFloat((findCompound.match(/^(\d+)/) || [])[1] || 1);

  const eqPlain = reaction.reactants.join(' + ') + ' \u2192 ' + reaction.products.join(' + ');
  const eqHTML  = formatEquationHTML(eqPlain);
  const idx     = currentQuestions.length;

  let givenAmount, answer, tolerance, questionText, answerUnits, stepStr, hintExtra;

  if (key === 'mole-to-mole') {
    // Given: moles of reactant → Find: moles of product
    givenAmount = Number(((Math.random() * (p.molesMax - 0.5)) + 0.5).toFixed(p.molesDecimals));
    answer      = Number((givenAmount * findCoeff / givenCoeff).toFixed(3));
    tolerance   = 0.5;
    questionText = `If you have <b>${givenAmount} moles</b> of ${formatEquationHTML(givenFormula)}, how many <b>moles</b> of ${formatEquationHTML(findFormula)} can be produced?`;
    answerUnits  = `moles of ${formatEquationHTML(findFormula)}`;
    stepStr      = `${givenAmount} mol ${givenFormula} x (${findCoeff} mol ${findFormula} / ${givenCoeff} mol ${givenFormula}) = ${answer} mol ${findFormula}`;
    hintExtra    = `<strong>Mole ratio:</strong> ${findCoeff} mol ${formatEquationHTML(findFormula)} per ${givenCoeff} mol ${formatEquationHTML(givenFormula)}`;

  } else if (key === 'mole-to-mass') {
    // Given: moles of reactant → Find: grams of product
    const mmFind    = calcMolarMass(findFormula);
    givenAmount     = Number(((Math.random() * (p.molesMax - 0.5)) + 0.5).toFixed(p.molesDecimals));
    const molesFind = givenAmount * findCoeff / givenCoeff;
    answer          = Number((molesFind * mmFind).toFixed(2));
    tolerance       = answer * 0.02;
    questionText    = `If you have <b>${givenAmount} moles</b> of ${formatEquationHTML(givenFormula)}, how many <b>grams</b> of ${formatEquationHTML(findFormula)} can be produced?`;
    answerUnits     = `grams of ${formatEquationHTML(findFormula)}`;
    stepStr         = `${givenAmount} mol ${givenFormula} x (${findCoeff}/${givenCoeff}) = ${molesFind.toFixed(4)} mol ${findFormula}; x ${mmFind.toFixed(3)} g/mol = ${answer} g`;
    hintExtra       = `<strong>Mole ratio:</strong> ${findCoeff} mol ${formatEquationHTML(findFormula)} per ${givenCoeff} mol ${formatEquationHTML(givenFormula)}<br><strong>Molar mass of ${formatEquationHTML(findFormula)}:</strong> ${mmFind.toFixed(3)} g/mol`;

  } else {
    // mass-to-mass: Given: grams of reactant → Find: grams of product
    const mmGiven   = calcMolarMass(givenFormula);
    const mmFind    = calcMolarMass(findFormula);
    const rawGrams  = Math.random() * (p.gramsMax - 5) + 5;
    givenAmount     = Number(rawGrams.toFixed(1));
    const molesGiven  = givenAmount / mmGiven;
    const molesFind   = molesGiven * findCoeff / givenCoeff;
    answer            = Number((molesFind * mmFind).toFixed(2));
    tolerance         = answer * 0.02;
    questionText      = `If you have <b>${givenAmount} grams</b> of ${formatEquationHTML(givenFormula)}, how many <b>grams</b> of ${formatEquationHTML(findFormula)} can be produced?`;
    answerUnits       = `grams of ${formatEquationHTML(findFormula)}`;
    stepStr           = `${givenAmount} g ${givenFormula} / ${mmGiven.toFixed(3)} g/mol = ${molesGiven.toFixed(4)} mol; x (${findCoeff}/${givenCoeff}) = ${molesFind.toFixed(4)} mol ${findFormula}; x ${mmFind.toFixed(3)} g/mol = ${answer} g`;
    hintExtra         = `<strong>Molar mass of ${formatEquationHTML(givenFormula)}:</strong> ${mmGiven.toFixed(3)} g/mol<br><strong>Mole ratio:</strong> ${findCoeff} mol ${formatEquationHTML(findFormula)} per ${givenCoeff} mol ${formatEquationHTML(givenFormula)}<br><strong>Molar mass of ${formatEquationHTML(findFormula)}:</strong> ${mmFind.toFixed(3)} g/mol`;
  }

  const html = `
    <div class="question-header">
      <div class="question-text">${idx + 1}. ${questionText}</div>
      <button class="hint-button" onclick="toggleHint(${idx})">&#128161; Hint</button>
    </div>
    <div class="hint-box" id="hint${idx}">
      <strong>Balanced Equation:</strong> ${eqHTML}<br>
      ${hintExtra}
    </div>
    <div class="chemical-formula">${eqHTML}</div>
    <div class="answer-input">
      <input type="number" step="0.01" id="answer${idx}" placeholder="Answer">
      <span>${answerUnits}</span>
    </div>
    <div class="feedback" id="feedback${idx}"></div>
  `;

  return { type:'stoichiometry', answer, tolerance, steps: stepStr, html };
}

function generateBalancingQuestion() {
  const reaction = getReactionByDifficulty();
  const idx = currentQuestions.length;

  const reactants = reaction.reactants.map(r => r.replace(/^(\d+)/,''));
  const products  = reaction.products.map(p => p.replace(/^(\d+)/,''));
  const correctCoeffs = reaction.reactants.concat(reaction.products).map(c => parseFloat((c.match(/^(\d+)/) || [])[1] || 1));
  const allCompounds = reactants.concat(products);

  const eqPlain = reactants.join(' + ') + ' → ' + products.join(' + ');
  const eqHTML = formatEquationHTML(eqPlain);

  const html = `
    <div class="question-header">
      <div class="question-text">${idx + 1}. Balance this equation:</div>
      <button class="hint-button" onclick="toggleHint(${idx})">&#128161; Hint</button>
    </div>
    <div class="hint-box" id="hint${idx}">
      <strong>Tip:</strong> Count atoms on each side.<br>
      <strong>Strategy:</strong> Start with the most complex compound.
    </div>
    <div class="chemical-formula">${eqHTML}</div>
    <div class="answer-input">
      ${allCompounds.map((c, i) => `
        <div class="coefficient-input">
          <input type="number" min="1" step="1" id="coeff${idx}_${i}" placeholder="?" />
          <span>${formatEquationHTML(c)}</span>
          ${i === reactants.length - 1 ? '<span style="margin:0 10px;">→</span>' : (i < allCompounds.length - 1 ? '<span style="margin:0 5px;">+</span>' : '')}
        </div>
      `).join('')}
    </div>
    <div class="feedback" id="feedback${idx}"></div>
  `;

  return { type:'balancing', answer: correctCoeffs, numCompounds: allCompounds.length,
           steps: `Correct coefficients: ${reaction.reactants.join(' + ')} → ${reaction.products.join(' + ')}`, html };
}


function toggleHint(index) {
  const box = document.getElementById('hint' + index);
  if (box) box.classList.toggle('show');
}

function markCorrect(el) {
  el.className = 'feedback correct';
  el.textContent = '✓ Correct!';
}
function markIncorrect(el, details) {
  el.className = 'feedback incorrect';
  el.innerHTML = `&#x2717; Incorrect.<br>${formatEquationHTML(escapeHtml(details))}`;
}

let answersChecked = false;

function checkAnswers() {
  let correct = 0;

  currentQuestions.forEach((q, i) => {
    const feedback = document.getElementById('feedback' + i);
    if (!answersChecked) stats.questionsToday++;

    if (q.type === 'stoichiometry') {
      const userAnswer = parseFloat(document.getElementById('answer' + i).value);
      const tol = q.tolerance ?? 0.5;
      if (!isNaN(userAnswer) && Math.abs(userAnswer - q.answer) <= tol) {
        if (!answersChecked) { correct++; stats.correctToday++; }
        markCorrect(feedback);
      } else {
        markIncorrect(feedback, `${q.steps}  (accepted within ±${tol.toFixed(2)})`);
      }
    }
    else if (q.type === 'balancing') {
      const userCoeffs = [];
      let valid = true;
      for (let j = 0; j < q.numCompounds; j++) {
        const val = parseInt(document.getElementById(`coeff${i}_${j}`).value, 10);
        if (isNaN(val) || val < 1) { valid = false; break; }
        userCoeffs.push(val);
      }
      const coeffsCorrect = JSON.stringify(userCoeffs) === JSON.stringify(q.answer);
      if (valid && coeffsCorrect) {
        if (!answersChecked) { correct++; stats.correctToday++; }
        markCorrect(feedback);
      } else {
        markIncorrect(feedback, q.steps);
      }
    }
  });

  if (!answersChecked) {
    saveStats();
    updateStatsDisplay();
  }
  answersChecked = true;

  document.getElementById('score').textContent = `${correct} / 5`;
  document.getElementById('scoreContainer').style.display = 'block';
}

(function init() {
  setActiveButton('stoichBtn', ['stoichBtn','balanceBtn']);
  document.getElementById('stoichTypeControl').style.display = 'flex';
  updateDifficultyNote();
  loadStats();
})();
</script>
